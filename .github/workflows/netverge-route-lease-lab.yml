name: NetVerge original route lease laboratory

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify
        type: choice
        default: windows-latest
        options: [windows-latest, macos-15, macos-15-intel, all]
  push:
    branches: [feat/whistle-integration, feat/mitm-dynamic-group-lab, feat/mitm-lazy-handshake-lab]
    paths:
      - 'engines/mihomo-route-lab/**'
      - 'engines/whistle/mitm-worker.cjs'
      - 'engines/whistle/ca-integrity.cjs'
      - 'engines/whistle/package.json'
      - '.github/workflows/netverge-route-lease-lab.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'latest-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  route-lease:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'all' && '["windows-latest","macos-15","macos-15-intel"]' || github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.platform) || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: netverge
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: MetaCubeX/mihomo
          ref: 0455d0d28c4526937380505153e65a843d8612e8
          path: mihomo-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: mihomo-source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install real Whistle worker dependencies
        working-directory: netverge/engines/whistle
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify upstream pin and install test-only source
        shell: bash
        run: |
          test "$(git -C mihomo-source rev-parse HEAD)" = 0455d0d28c4526937380505153e65a843d8612e8
          node netverge/engines/mihomo-route-lab/install-adapter-type-lab.cjs mihomo-source
          gofmt -w mihomo-source/adapter/outbound/base.go
          cp netverge/engines/mihomo-route-lab/netverge_route_lease_lab_test.go mihomo-source/tunnel/netverge_route_lease_lab_test.go
          cp netverge/engines/mihomo-route-lab/netverge_route_lease_export_test.go mihomo-source/tunnel/netverge_route_lease_export_test.go
          cp netverge/engines/mihomo-route-lab/netverge_route_whistle_lab_test.go mihomo-source/tunnel/netverge_route_whistle_lab_test.go
          cp netverge/engines/mihomo-route-lab/netverge_route_shared_whistle_lab_test.go mihomo-source/tunnel/netverge_route_shared_whistle_lab_test.go
          cp netverge/engines/mihomo-route-lab/netverge_route_dynamic_groups_lab_test.go mihomo-source/tunnel/netverge_route_dynamic_groups_lab_test.go
          cp netverge/engines/mihomo-route-lab/netverge_route_lazy_lab_test.go mihomo-source/tunnel/netverge_route_lazy_lab_test.go
          gofmt -w mihomo-source/tunnel/netverge_route_lazy_lab_test.go
          gofmt -w mihomo-source/tunnel/netverge_route_lease_lab_test.go mihomo-source/tunnel/netverge_route_lease_export_test.go mihomo-source/tunnel/netverge_route_whistle_lab_test.go mihomo-source/tunnel/netverge_route_shared_whistle_lab_test.go mihomo-source/tunnel/netverge_route_dynamic_groups_lab_test.go
      - name: Verify original route and single-use CONNECT lease
        working-directory: mihomo-source
        run: go test -tags with_gvisor ./tunnel -run '^TestNetVergeRouteLeaseOriginalDecision$' -count=1 -timeout=5m -v
      - name: Verify real Whistle decryption on original connection leases
        working-directory: mihomo-source
        env:
          NETVERGE_ROUTE_LAB_WORKER: ${{ github.workspace }}/netverge/engines/whistle/mitm-worker.cjs
        run: go test -tags with_gvisor ./tunnel -run '^TestNetVergeRouteLeaseWhistle$' -count=1 -timeout=5m -v
      - name: Verify shared Whistle instance with independent original routes
        working-directory: mihomo-source
        env:
          NETVERGE_ROUTE_LAB_WORKER: ${{ github.workspace }}/netverge/engines/whistle/mitm-worker.cjs
          NETVERGE_ROUTE_LAB_SHARED_WORKER: ${{ github.workspace }}/netverge/engines/mihomo-route-lab/shared-whistle-worker.cjs
        run: go test -tags with_gvisor ./tunnel -run '^TestNetVergeRouteLeaseSharedWhistle$' -count=1 -timeout=5m -v
      - name: Verify native dynamic policy groups through shared Whistle
        working-directory: mihomo-source
        env:
          NETVERGE_ROUTE_LAB_WORKER: ${{ github.workspace }}/netverge/engines/whistle/mitm-worker.cjs
          NETVERGE_ROUTE_LAB_SHARED_WORKER: ${{ github.workspace }}/netverge/engines/mihomo-route-lab/shared-whistle-worker.cjs
        run: go test -tags with_gvisor ./tunnel -run '^TestNetVergeRouteLeaseDynamicGroups$' -count=1 -timeout=5m -v

      - name: Verify lazy first-write handoff and failure containment
        working-directory: mihomo-source
        env:
          NETVERGE_ROUTE_LAB_WORKER: ${{ github.workspace }}/netverge/engines/whistle/mitm-worker.cjs
          NETVERGE_ROUTE_LAB_SHARED_WORKER: ${{ github.workspace }}/netverge/engines/mihomo-route-lab/shared-whistle-worker.cjs
        run: go test -tags with_gvisor ./tunnel -run '^TestNetVergeRouteLeaseLazyFirstWrite$' -count=1 -timeout=5m -v
