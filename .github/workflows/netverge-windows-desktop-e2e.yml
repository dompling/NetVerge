name: NetVerge Windows desktop MITM acceptance

on:
  push:
    branches: [feat/mitm-route-integration]
    paths:
      - '.github/workflows/netverge-windows-desktop-e2e.yml'
      - 'engines/mihomo-route/service/windows-desktop-e2e.cjs'
      - 'engines/mihomo-route/service/windows-desktop-uia.ps1'
      - 'engines/whistle/route-worker.cjs'
      - 'engines/whistle/windows-tun-lab.cjs'
      - 'engines/whistle/windows-tun-dns-readiness*.cjs'
      - 'engines/whistle/mitm-lab.cjs'
  workflow_dispatch:
    inputs:
      package_run:
        description: Successful Windows test-package workflow run ID
        default: '45634146475'
        required: true
        type: string
      package_name:
        description: Windows x64 ZIP artifact name
        default: NetVerge-MITM-Test-Windows-x64-a6b7217.zip
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        scenario: [packaged, rewrite]
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run || '45634146475' }}
          name: ${{ inputs.package_name || 'NetVerge-MITM-Test-Windows-x64-a6b7217.zip' }}
          path: desktop-artifact
      - name: Verify bounded DNS readiness behavior
        run: node --test engines/whistle/windows-tun-dns-readiness.test.cjs
      - name: Install TLS fixture dependencies
        working-directory: engines/whistle
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Click the MITM service switch and verify native TLS after app restart
        shell: pwsh
        env:
          TEST_PACKAGE_NAME: ${{ inputs.package_name || 'NetVerge-MITM-Test-Windows-x64-a6b7217.zip' }}
        run: |
          $package = (Resolve-Path -LiteralPath 'desktop-artifact').Path
          $archive = Join-Path $package $env:TEST_PACKAGE_NAME
          if (Test-Path -LiteralPath $archive -PathType Leaf) {
            $package = Join-Path $env:RUNNER_TEMP 'netverge-desktop-package'
            Expand-Archive -LiteralPath $archive -DestinationPath $package
          }
          if (!(Test-Path -LiteralPath (Join-Path $package 'NetVerge-MITM.exe') -PathType Leaf)) {
            throw 'The downloaded artifact does not contain the desktop test executable.'
          }
          node engines/mihomo-route/service/windows-desktop-e2e.cjs $package ${{ matrix.scenario }}
