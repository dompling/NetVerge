name: Cross Platform Cargo Check

on:
  workflow_dispatch:
    inputs:
      include_linux:
        description: 'Also run deferred Linux verification'
        type: boolean
        default: false
        required: false
  push:
    branches: [feat/whistle-integration]
    paths:
      - 'src-tauri/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - '.github/workflows/cross_check.yaml'

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  cargo-check:
    # Treat all Rust compiler warnings as errors
    env:
      RUSTFLAGS: '-D warnings'
      # CI checks and tests do not need full debug symbols; release profiles are unaffected.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.include_linux && '[{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}]' || '[{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'netverge-ci-rust-v2'
          key: '${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/feat/whistle-integration' }}
          cache-all-crates: true
          cache-workspace-crates: false

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libxslt1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
          pkg-config --modversion glib-2.0 gtk+-3.0 webkit2gtk-4.1

      - name: Cargo Check (deny warnings)
        working-directory: src-tauri
        run: |
          cargo check --target ${{ matrix.target }} --workspace --all-features

      - name: Run MITM Rust configuration unit tests
        working-directory: src-tauri
        run: cargo test -p clash-verge --lib --features clippy --target ${{ matrix.target }} core::mitm::tests

      - name: Provision frontend placeholder for contract generator
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            printf '<!doctype html><html><head></head><body></body></html>\n' > dist/index.html
          fi

      - name: Generate frontend contract for review
        if: runner.os == 'macOS'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          pnpm gen:contract
          git diff -- src/services/bindings.ts
          pnpm typecheck

      - name: Upload generated frontend contract
        if: runner.os == 'macOS' && success()
        uses: actions/upload-artifact@v4
        with:
          name: netverge-frontend-contract
          path: src/services/bindings.ts
          if-no-files-found: error
