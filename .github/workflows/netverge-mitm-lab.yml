name: NetVerge MITM laboratory

on:
  workflow_dispatch:
    inputs:
      include_linux:
        description: 'Also run deferred Linux verification'
        type: boolean
        default: false
        required: false
  push:
    branches: [feat/whistle-integration]
    paths:
      - 'engines/whistle/**'
      - 'src-tauri/src/core/mitm.rs'
      - 'src-tauri/src/core/mitm/**'
      - 'src-tauri/src/core/manager/**'
      - '.github/workflows/netverge-mitm-lab.yml'

# Only the latest push to this integration branch matters; preserve manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'latest-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  mitm:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.include_linux && '["windows-latest","macos-15","macos-15-intel","ubuntu-latest"]' || '["windows-latest","macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Fetch verified Mihomo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mihomo.zip'
          Invoke-WebRequest 'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-windows-amd64-v1.19.34.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'f6b855de8722781caea62686f0301f89625fc558d48c1103ffdd98dad7f7f488') { throw 'Mihomo checksum mismatch' }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP 'mihomo-bin')
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'mihomo-bin') -Recurse -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Mihomo executable not found' }
          "NETVERGE_MIHOMO_BIN=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Fetch verified Mihomo (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --silent --show-error 'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz' -o "$RUNNER_TEMP/mihomo.gz"
          echo "223fab877e5795ce780ba39902e5f0b1113c1256ae244a7160f1165e017e9ccc  $RUNNER_TEMP/mihomo.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          echo "NETVERGE_MIHOMO_BIN=$RUNNER_TEMP/mihomo" >> "$GITHUB_ENV"
      - name: Fetch verified Mihomo (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64)
              asset=mihomo-darwin-arm64-v1.19.34.gz
              checksum=1a7a20eca63fbbaec90137717465bfde488d0db2a3a79b8fadebf9b2545b6e4c
              ;;
            x86_64)
              asset=mihomo-darwin-amd64-v1.19.34.gz
              checksum=089b033be801ff365b6558851115238b443b237433aa0841bc3fa41ad75a3927
              ;;
            *) echo 'Unsupported macOS architecture'; exit 1 ;;
          esac
          curl --fail --location --silent --show-error "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/$asset" -o "$RUNNER_TEMP/mihomo.gz"
          echo "$checksum  $RUNNER_TEMP/mihomo.gz" | shasum -a 256 -c
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          echo "NETVERGE_MIHOMO_BIN=$RUNNER_TEMP/mihomo" >> "$GITHUB_ENV"
      - name: Install lab dependencies
        working-directory: engines/whistle
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify root CA custody and key correspondence
        working-directory: engines/whistle
        run: node --test ca-integrity.test.cjs
      - name: Verify selective HTTPS interception
        working-directory: engines/whistle
        run: npm run test:mitm
      - name: Verify actual TUN interception in isolated Linux network namespace
        if: runner.os == 'Linux'
        working-directory: engines/whistle
        shell: bash
        run: |
          sudo modprobe tun || test -c /dev/net/tun
          test -c /dev/net/tun
          sudo env "PATH=$PATH" "NETVERGE_MIHOMO_BIN=$NETVERGE_MIHOMO_BIN" "NETVERGE_TUN_LAB_HOST_NS=$(readlink /proc/self/ns/net)" unshare --net -- bash -euc '
            ip link set lo up
            node mitm-lab.cjs --tun
          '
