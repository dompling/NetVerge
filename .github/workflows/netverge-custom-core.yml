name: NetVerge custom Mihomo build
on:
  push:
    branches: [feat/mitm-route-integration]
    paths:
      - 'engines/mihomo-route/**'
      - 'src/components/mitm/response-rule-editor.tsx'
      - 'src-tauri/src/core/mitm/rewrite.rs'
      - 'src-tauri/src/core/mitm/service_generation.rs'
      - 'src-tauri/src/core/mitm/service_pipe.rs'
      - 'src-tauri/src/core/mitm/control_http.rs'
      - 'src-tauri/src/core/mitm/controller_state.rs'
      - 'src-tauri/src/core/mitm/service_restore.rs'
      - 'engines/mihomo-route-lab/install-adapter-type-lab.cjs'
      - 'engines/whistle/route-worker.cjs'
      - 'engines/whistle/ca-integrity.cjs'
      - 'engines/whistle/package.json'
      - '.github/workflows/netverge-custom-core.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Native build platform
        type: choice
        default: windows-latest
        options: [windows-latest, macos-15, macos-15-intel, all]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'latest-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'all' && '["windows-latest","macos-15","macos-15-intel"]' || github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.platform) || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: netverge
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: MetaCubeX/mihomo
          ref: 0455d0d28c4526937380505153e65a843d8612e8
          path: mihomo-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: mihomo-source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install pinned core source
        shell: bash
        run: |
          test "$(git -C mihomo-source rev-parse HEAD)" = 0455d0d28c4526937380505153e65a843d8612e8
          mkdir -p mihomo-source/routelease mihomo-source/netvergecontrol
          cp netverge/engines/mihomo-route/routelease/lease.go mihomo-source/routelease/
          cp netverge/engines/mihomo-route/control/controller.go mihomo-source/netvergecontrol/
          cp netverge/engines/mihomo-route/tunnel/netverge_route_hook.go mihomo-source/tunnel/
          node netverge/engines/mihomo-route-lab/install-adapter-type-lab.cjs mihomo-source
          node netverge/engines/mihomo-route/install-tunnel-hook.cjs mihomo-source
          node netverge/engines/mihomo-route/install-core-control.cjs mihomo-source
          gofmt -w mihomo-source/main.go mihomo-source/adapter/outbound/base.go mihomo-source/tunnel/tunnel.go mihomo-source/tunnel/netverge_route_hook.go mihomo-source/routelease/lease.go mihomo-source/netvergecontrol/controller.go
      - name: Build custom engine
        shell: bash
        working-directory: mihomo-source
        env:
          CGO_ENABLED: '0'
          GOAMD64: v1
        run: |
          mkdir -p ../artifact
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          version="netverge-${GITHUB_SHA:0:12}"
          go build -tags with_gvisor -trimpath -ldflags "-s -w -X github.com/metacubex/mihomo/constant.Version=$version" -o "../artifact/mihomo-netverge$ext" .
          "../artifact/mihomo-netverge$ext" -v
          node ../netverge/engines/mihomo-route/smoke-core.cjs "../artifact/mihomo-netverge$ext"
      - name: Test isolated Windows service pipe bootstrap
        if: runner.os == 'Windows'
        shell: bash
        working-directory: mihomo-source
        env:
          CGO_ENABLED: '0'
          GOAMD64: v1
        run: |
          node ../netverge/engines/mihomo-route/service/install.cjs .
          gofmt -w hub/route/server.go hub/route/netverge_service_pipe_lab.go
          mkdir -p ../service-lab
          go build -tags "with_gvisor netverge_service_lab" -trimpath -o ../service-lab/mihomo-service-lab.exe .
          node ../netverge/engines/mihomo-route/service/smoke.cjs ../artifact/mihomo-netverge.exe ../service-lab/mihomo-service-lab.exe
      - name: Set up Rust for isolated service integration
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
      - name: Install Whistle for the service integration
        if: runner.os == 'Windows'
        working-directory: netverge/engines/whistle
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Exercise actual upstream service watchdog from Rust
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          $core = Join-Path $env:GITHUB_WORKSPACE 'service-lab/mihomo-service-lab.exe'
          $worker = Join-Path $env:GITHUB_WORKSPACE 'netverge/engines/whistle/route-worker.cjs'
          $manifest = 'netverge/engines/mihomo-route/service/rust-lab/Cargo.toml'
          # The service v2.8.1 lock pins this compatible logging revision.
          # A fresh independent workspace otherwise follows tracing-estuary main (flexi_logger 0.32).
          cargo generate-lockfile --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo update --manifest-path $manifest -p tracing-estuary --precise dbfce033fa4cff8f936f3e7c2282af1277546f3c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked --manifest-path $manifest -- "$core" "$worker"
      - uses: actions/checkout@v7
        if: runner.os == 'Windows'
        with:
          repository: clash-verge-rev/clash-verge-service-ipc
          ref: 9d4ea7d27fb3c43804bd18f3bb3b686528763239
          path: service-source
          persist-credentials: false
      - name: Verify Windows development service installation and guarded core recovery
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 8
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE 'netverge/engines/mihomo-route/service/windows-install.patch'
          git -C service-source apply --whitespace=error $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path service-source/Cargo.toml --features standalone,client,development-channel --bin clash-verge-service --bin clash-verge-service-install --bin clash-verge-service-uninstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $worker = Join-Path $env:GITHUB_WORKSPACE 'netverge/engines/whistle/route-worker.cjs'
          & ./netverge/engines/mihomo-route/service/test-windows-install.ps1 -BuildDirectory './service-source/target/debug' -GuardedCore './service-lab/mihomo-service-lab.exe' -Worker $worker
      - name: Stage Windows test package components and a previous-version fixture
        if: runner.os == 'Windows'
        shell: bash
        working-directory: mihomo-source
        env:
          CGO_ENABLED: '0'
          GOAMD64: v1
        run: |
          mkdir -p ../windows-mitm-components
          cp ../artifact/mihomo-netverge.exe ../windows-mitm-components/verge-mihomo.exe
          cp ../service-lab/mihomo-service-lab.exe ../windows-mitm-components/netverge-mihomo-service.exe
          cp ../service-source/target/debug/clash-verge-service{,-install,-uninstall}.exe ../windows-mitm-components/
          go build -tags "with_gvisor netverge_service_lab" -trimpath -ldflags "-X github.com/metacubex/mihomo/constant.Version=netverge-rollback-fixture" -o ../windows-mitm-components/previous-core.exe .
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-mitm-components
          path: windows-mitm-components/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-netverge-${{ matrix.os }}-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
  windows-test-package:
    name: Build and verify Windows x64 MITM test package
    needs: core
    if: github.event_name == 'push' || inputs.platform == 'windows-latest' || inputs.platform == 'all'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '0'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '32'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_INCREMENTAL: '0'
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-mitm-components
          path: windows-mitm-components
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'netverge-windows-mitm-test-package-v1'
          cache-all-crates: true
          cache-workspace-crates: false
      - name: Build the isolated desktop client
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run prebuild x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec tauri build --no-bundle --features verge-dev --target x86_64-pc-windows-msvc --config ./engines/mihomo-route/service/windows-test-tauri.json
      - name: Verify install, upgrade and rollback from the extracted Windows test package
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "NetVerge-MITM-Test-Windows-x64-$($env:GITHUB_SHA.Substring(0, 7)).zip"
          $scripts = Join-Path $env:GITHUB_WORKSPACE 'engines/mihomo-route/service'
          $components = Join-Path $env:GITHUB_WORKSPACE 'windows-mitm-components'
          $desktop = Join-Path $env:GITHUB_WORKSPACE 'target/x86_64-pc-windows-msvc/release/clash-verge.exe'
          & "$scripts/package-windows-mitm.ps1" -SourceRoot $env:GITHUB_WORKSPACE -Components $components -Desktop $desktop -Archive $archive
          & "$scripts/test-windows-package.ps1" -Archive $archive -PreviousCore "$components/previous-core.exe"
      - uses: actions/upload-artifact@v7
        with:
          path: NetVerge-MITM-Test-Windows-x64-*.zip
          archive: false
          if-no-files-found: error

  windows-rewrite-editor:
    needs: windows-test-package
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
      - uses: actions/download-artifact@v8
        with:
          pattern: NetVerge-MITM-Test-Windows-x64-*.zip
          merge-multiple: true
          path: desktop-artifact
      - name: Install probe dependencies
        working-directory: engines/whistle
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify packaged rewrite editor through Windows UI and TLS
        shell: pwsh
        run: |
          $package = (Resolve-Path desktop-artifact).Path
          $zip = Get-ChildItem $package -Filter 'NetVerge-MITM-Test-Windows-x64-*.zip' | Select-Object -First 1
          if ($zip) {
            $package = Join-Path $env:RUNNER_TEMP 'netverge-rewrite-editor'
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $package
          }
          node engines/mihomo-route/service/windows-desktop-e2e.cjs $package editor-filters
