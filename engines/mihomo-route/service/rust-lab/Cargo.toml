[package]
name = "netverge-service-integration-lab"
version = "0.1.0"
edition = "2024"
publish = false

# Separate from the desktop workspace: service test mode must never unify
# with the production client or relax its installed-core trust boundary.
[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "process"] }
clash_verge_service_ipc = { git = "https://github.com/clash-verge-rev/clash-verge-service-ipc.git", tag = "v2.8.1", features = ["standalone", "client", "test"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading"] }
